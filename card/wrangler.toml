name = "spotify-card"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
DISCORD_ID = "403927182797307904"
# SPOTIFY_CARD_UID is a secret (wrangler secret put SPOTIFY_CARD_UID): the uid
# from logging in at https://spotify-github-profile.kittinanx.com/api/login

# Checks what's playing every 5 minutes so the last track stays current
[triggers]
crons = ["*/5 * * * *"]

# Remembers the last track so the card can show "Recently played"
[[kv_namespaces]]
binding = "CARD_KV"
id = "f5e40f253d5047b99634fd113b1d2734"
