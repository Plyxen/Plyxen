# Draws the snake that eats your contribution graph and publishes it to the "output" branch,
# where README.md picks it up.
name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7aa2f7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#bf91f3&color_dots=#1f2335,#2b3a67,#3f5a9e,#5a80d6,#70a5fd

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
